<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InkStats — 刺青師帳號健康度</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:#0f1117; --surface:#1a1d27; --surface2:#22263a; --border:#2e3350;
    --text:#e8eaf0; --muted:#7b82a0;
    --accent:#7c6ff7; --accent2:#5b8af5;
    --green:#34d399; --yellow:#fbbf24; --red:#f87171;
    --green-bg:rgba(52,211,153,.12); --yellow-bg:rgba(251,191,36,.12); --red-bg:rgba(248,113,113,.12);
    --accent-bg:rgba(124,111,247,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;min-height:100vh}
  nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:58px}
  .nav-brand{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px}
  .dot-live{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .nav-tabs{display:flex;gap:4px}
  .nav-tab{padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--muted);border:none;background:none;transition:all .2s}
  .nav-tab.active{background:var(--accent-bg);color:var(--accent);font-weight:600}
  .nav-tab:hover:not(.active){background:var(--surface2);color:var(--text)}
  .sync-btn{background:var(--accent);color:white;border:none;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s}
  .sync-btn:hover{opacity:.85}
  .sync-btn:disabled{opacity:.5;cursor:not-allowed}
  main{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
  .connect-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;gap:20px}
  .connect-icon{font-size:64px}
  .connect-screen h2{font-size:24px;font-weight:700}
  .connect-screen p{color:var(--muted);font-size:15px;max-width:400px;line-height:1.6}
  .connect-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;padding:14px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:opacity .2s}
  .connect-btn:hover{opacity:.9}
  .connect-note{font-size:12px;color:var(--muted);max-width:360px;line-height:1.6}
  .account-header{background:linear-gradient(135deg,#1e2240,#232845);border:1px solid var(--border);border-radius:16px;padding:20px 24px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .avatar{width:54px;height:54px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0;overflow:hidden}
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .account-info h2{font-size:18px;font-weight:700;margin-bottom:4px}
  .account-info p{font-size:13px;color:var(--muted)}
  .account-stats{margin-left:auto;display:flex;gap:28px;text-align:center}
  .stat-val{font-size:20px;font-weight:700}
  .stat-lbl{font-size:11px;color:var(--muted);margin-top:2px}
  .stat-delta{font-size:11px;margin-top:2px}
  .delta-up{color:var(--green)} .delta-down{color:var(--red)}
  .disconnect-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;margin-left:12px}
  .disconnect-btn:hover{border-color:var(--red);color:var(--red)}
  .section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
  .overall-row{display:grid;grid-template-columns:200px 1fr;gap:20px;margin-bottom:24px}
  .overall-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-wrap{position:relative;width:120px;height:120px;margin-bottom:12px}
  .ring-wrap svg{transform:rotate(-90deg)}
  .ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .score-big{font-size:32px;font-weight:800;line-height:1}
  .score-sub{font-size:11px;color:var(--muted);margin-top:2px}
  .overall-status{font-size:14px;font-weight:700;margin-top:4px}
  .radar-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px 20px;display:flex;align-items:center;justify-content:center}
  .dim-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px}
  .dim-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 14px;cursor:default;position:relative;overflow:hidden}
  .dim-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
  .c-reach::before{background:#7c6ff7} .c-engage::before{background:#34d399}
  .c-consist::before{background:#fbbf24} .c-convert::before{background:#f87171}
  .c-audience::before{background:#5b8af5}
  .dim-icon{font-size:22px;margin-bottom:8px}
  .dim-name{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .dim-score{font-size:30px;font-weight:800;line-height:1;margin-bottom:4px}
  .dim-bar-bg{height:4px;background:var(--border);border-radius:4px;margin-bottom:8px;overflow:hidden}
  .dim-bar-fill{height:100%;border-radius:4px;transition:width 1s cubic-bezier(.4,0,.2,1)}
  .dim-trend{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600}
  .trend-up{color:var(--green)} .trend-down{color:var(--red)} .trend-flat{color:var(--muted)}
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px}
  .chart-card h3{font-size:14px;font-weight:600;margin-bottom:4px}
  .chart-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
  .recs-list{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
  .rec-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .rec-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
  .priority-badge{padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
  .p1{background:rgba(248,113,113,.15);color:#f87171} .p2{background:rgba(251,191,36,.15);color:#fbbf24} .p3{background:rgba(52,211,153,.15);color:#34d399}
  .rec-title{font-size:15px;font-weight:700;flex:1}
  .rec-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:12px}
  .rec-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .btn-ghost{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:none;border:1px solid var(--border);color:var(--muted);transition:all .2s}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:var(--accent-bg);border:1px solid var(--accent);color:var(--accent);transition:all .2s}
  .btn-primary:hover{background:var(--accent);color:white}
  .posts-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:24px}
  .posts-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .posts-head h3{font-size:14px;font-weight:600}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{padding:10px 16px;text-align:left;color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;background:var(--surface2);border-bottom:1px solid var(--border)}
  td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:var(--surface2)}
  .type-badge{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
  .type-VIDEO{background:rgba(124,111,247,.15);color:#7c6ff7}
  .type-IMAGE{background:rgba(91,138,245,.15);color:#5b8af5}
  .type-CAROUSEL_ALBUM{background:rgba(251,191,36,.15);color:#fbbf24}
  .audience-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
  .aud-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .aud-card h3{font-size:14px;font-weight:600;margin-bottom:14px}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12px}
  .bar-label{width:80px;color:var(--muted);flex-shrink:0}
  .bar-bg{flex:1;height:6px;background:var(--border);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px}
  .bar-val{width:40px;text-align:right;font-weight:600}
  .heatmap{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:8px}
  .heat-cell{aspect-ratio:1;border-radius:2px;cursor:default}
  .heat-hours{display:grid;grid-template-columns:repeat(24,1fr);gap:3px;margin-top:4px}
  .heat-h{font-size:8px;color:var(--muted);text-align:center}
  .tab-view{display:none} .tab-view.active{display:block}
  .loading-state,.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--muted)}
  .loading-state .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:999;white-space:nowrap;display:flex;align-items:center;gap:8px}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:8px 0 12px;z-index:100;justify-content:space-around}
  .mob-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);cursor:pointer;padding:4px 16px}
  .mob-item.active{color:var(--accent)}
  .mob-item span{font-size:20px}
  @media(max-width:900px){.dim-grid{grid-template-columns:repeat(3,1fr)}.overall-row,.charts-row{grid-template-columns:1fr}.audience-grid{grid-template-columns:1fr}}
  @media(max-width:600px){.dim-grid{grid-template-columns:repeat(2,1fr)}.account-stats{width:100%;justify-content:space-around}.nav-tabs{display:none}main{padding:16px 14px 80px}.mobile-nav{display:flex}}
</style>
</head>
<body>

<nav>
  <div class="nav-brand">🖋️ InkStats <span class="dot-live" id="live-dot" style="display:none"></span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('dashboard',this)">總覽</button>
    <button class="nav-tab" onclick="switchTab('analytics',this)">數據分析</button>
    <button class="nav-tab" onclick="switchTab('recommendations',this)">建議</button>
    <button class="nav-tab" onclick="switchTab('audience',this)">受眾</button>
  </div>
  <button class="sync-btn" id="sync-btn" onclick="triggerSync()">↻ 同步</button>
</nav>

<main>
  <div id="connect-screen" class="connect-screen" style="display:none">
    <div class="connect-icon">📱</div>
    <h2>連結你的 Instagram 帳號</h2>
    <p>連結你的 Instagram 商業或創作者帳號，即可開始追蹤帳號健康度、取得診斷建議。</p>
    <button class="connect-btn" onclick="connectIG()">連結 Instagram 帳號</button>
    <p class="connect-note">需要 Instagram 商業帳號或創作者帳號。<br>你的數據只會存在後端資料庫，不會分享給第三方。</p>
  </div>

  <div id="main-content" style="display:none">
    <div class="tab-view active" id="tab-dashboard">
      <div class="account-header" id="account-header">
        <div class="avatar" id="avatar">?</div>
        <div class="account-info">
          <h2 id="acct-username">載入中...</h2>
          <p id="acct-meta">連接中...</p>
        </div>
        <div class="account-stats" id="account-stats"></div>
        <button class="disconnect-btn" onclick="disconnectIG()">斷開連結</button>
      </div>

      <div class="section-title">整體健康度</div>
      <div class="overall-row">
        <div class="overall-card">
          <div class="ring-wrap">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="12"/>
              <circle id="ring-circle" cx="60" cy="60" r="52" fill="none"
                stroke="url(#rg)" stroke-width="12" stroke-linecap="round"
                stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
              <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7c6ff7"/>
                <stop offset="100%" stop-color="#34d399"/>
              </linearGradient></defs>
            </svg>
            <div class="ring-label">
              <span class="score-big" id="overall-num">—</span>
              <span class="score-sub">/ 100</span>
            </div>
          </div>
          <div style="color:var(--muted);font-size:13px;font-weight:600">整體分數</div>
          <div class="overall-status" id="overall-status"></div>
        </div>
        <div class="radar-card">
          <canvas id="radarChart" style="max-height:220px;max-width:360px"></canvas>
        </div>
      </div>

      <div class="section-title">五個維度</div>
      <div class="dim-grid" id="dim-grid">
        <div class="loading-state" style="grid-column:1/-1;padding:30px"><div class="spinner"></div></div>
      </div>

      <div class="section-title">近 30 天趨勢</div>
      <div class="charts-row">
        <div class="chart-card">
          <h3>整體分數走勢</h3>
          <p class="chart-sub">過去 30 天健康度</p>
          <canvas id="trendChart" style="max-height:160px"></canvas>
        </div>
        <div class="chart-card">
          <h3>粉絲動態</h3>
          <p class="chart-sub">每日觸及人數</p>
          <canvas id="growthChart" style="max-height:160px"></canvas>
        </div>
      </div>

      <div class="section-title">優先建議</div>
      <div id="recs-preview"></div>
    </div>

    <div class="tab-view" id="tab-analytics">
      <div class="section-title">貼文表現</div>
      <div class="posts-card">
        <div class="posts-head"><h3>近期貼文</h3></div>
        <div id="posts-container"><div class="loading-state"><div class="spinner"></div></div></div>
      </div>
    </div>

    <div class="tab-view" id="tab-recommendations">
      <div class="section-title">本週建議</div>
      <div id="recs-full"><div class="loading-state"><div class="spinner"></div></div></div>
    </div>

    <div class="tab-view" id="tab-audience">
      <div class="section-title">受眾分析</div>
      <div class="audience-grid" id="audience-content">
        <div class="loading-state" style="grid-column:1/-1"><div class="spinner"></div></div>
      </div>
    </div>
  </div>
</main>

<div class="mobile-nav">
  <div class="mob-item active" onclick="switchTabMobile('dashboard',this)"><span>📊</span>總覽</div>
  <div class="mob-item" onclick="switchTabMobile('analytics',this)"><span>📈</span>數據</div>
  <div class="mob-item" onclick="switchTabMobile('recommendations',this)"><span>💡</span>建議</div>
  <div class="mob-item" onclick="switchTabMobile('audience',this)"><span>👥</span>受眾</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://inkstats-backend-production.up.railway.app';
let radarChart, trendChart, growthChart, ageChart;
let currentAccount = null;

async function init() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('auth') === 'success') {
    showToast('✅ Instagram 帳號連結成功！');
    window.history.replaceState({}, '', window.location.pathname);
  }
  if (params.get('error')) {
    showToast('❌ 連結失敗：' + params.get('error'));
    window.history.replaceState({}, '', window.location.pathname);
  }
  await loadAccount();
}

async function loadAccount() {
  try {
    const res = await fetch(`${API}/api/account`);
    if (!res.ok) { showConnectScreen(); return; }
    const acct = await res.json();
    currentAccount = acct;
    showMainContent(acct);
    await Promise.all([loadHealthScore(), loadRecsPreview()]);
  } catch (e) {
    showConnectScreen();
    showToast('⚠️ 無法連線後端');
  }
}

function connectIG() {
  const popup = window.open(`${API}/auth/ig/login`, '_blank', 'width=600,height=700');
  showToast('⏳ 請在新視窗完成 Instagram 授權...');
  const poll = setInterval(async () => {
    try {
      const res = await fetch(`${API}/api/account`);
      if (res.ok) {
        clearInterval(poll);
        if (popup && !popup.closed) popup.close();
        showToast('✅ 授權成功！正在載入數據...');
        await loadAccount();
      }
    } catch(e) {}
  }, 2000);
  setTimeout(() => clearInterval(poll), 120000);
}

async function disconnectIG() {
  if (!confirm('確定要斷開 Instagram 帳號連結嗎？')) return;
  currentAccount = null;
  showConnectScreen();
  showToast('已斷開帳號連結');
}

function showConnectScreen() {
  document.getElementById('connect-screen').style.display = 'flex';
  document.getElementById('main-content').style.display = 'none';
  document.getElementById('live-dot').style.display = 'none';
}

function showMainContent(acct) {
  document.getElementById('connect-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
  document.getElementById('live-dot').style.display = 'inline-block';
  document.getElementById('acct-username').textContent = '@' + acct.username;
  document.getElementById('acct-meta').textContent = '商業帳號 · ' +
    (acct.last_synced_at ? '上次同步：' + formatTime(acct.last_synced_at) : '尚未同步');
  const avatarEl = document.getElementById('avatar');
  if (acct.profile_picture_url) {
    avatarEl.innerHTML = `<img src="${acct.profile_picture_url}" alt="avatar">`;
  } else {
    avatarEl.textContent = (acct.username || '?')[0].toUpperCase();
  }
  document.getElementById('account-stats').innerHTML = `
    <div><div class="stat-val">${fmt(acct.followers_count)}</div><div class="stat-lbl">粉絲</div></div>
    <div><div class="stat-val">${fmt(acct.follows_count)}</div><div class="stat-lbl">追蹤中</div></div>
    <div><div class="stat-val">${fmt(acct.media_count)}</div><div class="stat-lbl">貼文數</div></div>
  `;
}

async function loadHealthScore() {
  const [scoreRes, histRes] = await Promise.all([
    fetch(`${API}/api/health-score`),
    fetch(`${API}/api/health-score/history`),
  ]);
  if (!scoreRes.ok) {
    document.getElementById('dim-grid').innerHTML =
      '<div class="empty-state" style="grid-column:1/-1">尚無評分數據，請點「↻ 同步」取得最新數據</div>';
    return;
  }
  const score = await scoreRes.json();
  const hist = histRes.ok ? await histRes.json() : [];
  renderDimensions(score);
  renderOverallScore(score.overall);
  renderTrendChart(hist);
  renderGrowthChart();
  renderRadar(score);
}

function renderOverallScore(val) {
  const circle = document.getElementById('ring-circle');
  const numEl = document.getElementById('overall-num');
  const circ = 2 * Math.PI * 52;
  let cur = 0;
  const step = () => {
    cur = Math.min(cur + 2, val);
    circle.style.strokeDashoffset = circ - (circ * cur / 100);
    numEl.textContent = Math.round(cur);
    if (cur < val) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  const statusEl = document.getElementById('overall-status');
  if (val >= 75) { statusEl.textContent = '🟢 優秀'; statusEl.style.color = 'var(--green)'; }
  else if (val >= 55) { statusEl.textContent = '🟡 良好'; statusEl.style.color = 'var(--yellow)'; }
  else { statusEl.textContent = '🔴 需改善'; statusEl.style.color = 'var(--red)'; }
}

const DIM_CONFIG = [
  {key:'reach',      name:'觸及力',   icon:'📡', cls:'c-reach',    color:'#7c6ff7'},
  {key:'engagement', name:'互動質量', icon:'💬', cls:'c-engage',   color:'#34d399'},
  {key:'consistency',name:'一致性',   icon:'📅', cls:'c-consist',  color:'#fbbf24'},
  {key:'conversion', name:'轉化效率', icon:'🔗', cls:'c-convert',  color:'#f87171'},
  {key:'audience',   name:'受眾健康', icon:'👥', cls:'c-audience', color:'#5b8af5'},
];

function renderDimensions(score) {
  const grid = document.getElementById('dim-grid');
  grid.innerHTML = DIM_CONFIG.map(d => {
    const val = Math.round(score[d.key + '_score'] ?? 0);
    const scoreColor = val >= 70 ? 'var(--green)' : val >= 50 ? 'var(--yellow)' : 'var(--red)';
    return `<div class="dim-card ${d.cls}">
      <div class="dim-icon">${d.icon}</div>
      <div class="dim-name">${d.name}</div>
      <div class="dim-score" style="color:${scoreColor}">${val}</div>
      <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:0%;background:${d.color}" data-w="${val}%"></div></div>
      <div class="dim-trend trend-flat">→ 持平</div>
    </div>`;
  }).join('');
  setTimeout(() => document.querySelectorAll('.dim-bar-fill').forEach(el => el.style.width = el.dataset.w), 100);
}

function renderRadar(score) {
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(document.getElementById('radarChart'), {
    type: 'radar',
    data: {
      labels: DIM_CONFIG.map(d => d.name),
      datasets: [{
        label: '本週', borderColor: '#7c6ff7', backgroundColor: 'rgba(124,111,247,.15)',
        pointBackgroundColor: '#7c6ff7', pointRadius: 4,
        data: DIM_CONFIG.map(d => Math.round(score[d.key + '_score'] ?? 0)),
      }]
    },
    options: {
      responsive: true, plugins: { legend: {display: false} },
      scales: { r: { min: 0, max: 100,
        ticks: {color:'#7b82a0', font:{size:9}, backdropColor:'transparent'},
        grid: {color:'rgba(46,51,80,.7)'},
        pointLabels: {color:'#e8eaf0', font:{size:12, weight:'600'}},
      }}
    }
  });
}

function renderTrendChart(hist) {
  if (trendChart) trendChart.destroy();
  if (!hist.length) return;
  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'line',
    data: { labels: hist.map(h => (h.created_at||'').slice(5,10)),
      datasets: [{data: hist.map(h => h.overall), borderColor: '#7c6ff7',
        backgroundColor: 'rgba(124,111,247,.1)', fill: true, tension: .4, pointRadius: 0, borderWidth: 2}]},
    options: { responsive: true, plugins: {legend:{display:false}},
      scales: {
        x: {ticks:{color:'#7b82a0',font:{size:10},maxTicksLimit:6}, grid:{color:'rgba(46,51,80,.4)'}},
        y: {min:0, max:100, ticks:{color:'#7b82a0',font:{size:10}}, grid:{color:'rgba(46,51,80,.4)'}},
      }}
  });
}

async function renderGrowthChart() {
  if (growthChart) growthChart.destroy();
  try {
    const res = await fetch(`${API}/api/analytics/overview`);
    const daily = res.ok ? await res.json() : [];
    if (!daily.length) return;
    growthChart = new Chart(document.getElementById('growthChart'), {
      type: 'bar',
      data: { labels: daily.map(d => (d.date||'').slice(5)),
        datasets: [{data: daily.map(d => d.reach || 0),
          backgroundColor: 'rgba(124,111,247,.6)', borderRadius: 3, borderSkipped: false}]},
      options: { responsive: true, plugins: {legend:{display:false}},
        scales: {
          x: {ticks:{color:'#7b82a0',font:{size:10},maxTicksLimit:6}, grid:{display:false}},
          y: {ticks:{color:'#7b82a0',font:{size:10}}, grid:{color:'rgba(46,51,80,.4)'}},
        }}
    });
  } catch(e) {}
}

async function loadRecsPreview() {
  const recs = await fetchRecs();
  const el = document.getElementById('recs-preview');
  if (!recs.length) { el.innerHTML = '<div class="empty-state">帳號狀態良好，目前沒有建議 🎉</div>'; return; }
  el.innerHTML = renderRecCards(recs.slice(0, 2));
  el.innerHTML += `<button class="btn-ghost" onclick="switchTab('recommendations',document.querySelectorAll('.nav-tab')[2])" style="width:100%;padding:10px;margin-top:4px">查看全部建議 →</button>`;
}

async function loadRecsFull() {
  const recs = await fetchRecs();
  const el = document.getElementById('recs-full');
  if (!recs.length) { el.innerHTML = '<div class="empty-state">目前沒有活躍建議 🎉</div>'; return; }
  el.innerHTML = renderRecCards(recs);
}

async function fetchRecs() {
  try { const res = await fetch(`${API}/api/recommendations`); return res.ok ? await res.json() : []; }
  catch { return []; }
}

function renderRecCards(recs) {
  return `<div class="recs-list">${recs.map(r => `
    <div class="rec-card" id="rec-card-${r.id}">
      <div class="rec-header">
        <span class="priority-badge p${r.priority}">P${r.priority} 優先</span>
        <div class="rec-title">${r.title}</div>
      </div>
      <p class="rec-desc">${r.description || ''}</p>
      <div class="rec-footer">
        <button class="btn-ghost" onclick="dismissRec(${r.id})">忽略</button>
      </div>
    </div>`).join('')}</div>`;
}

function dismissRec(id) {
  const el = document.getElementById('rec-card-' + id);
  if (el) { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }
}

async function loadPosts() {
  const container = document.getElementById('posts-container');
  container.innerHTML = '<div class="loading-state"><div class="spinner"></div></div>';
  try {
    const res = await fetch(`${API}/api/analytics/posts`);
    const posts = res.ok ? await res.json() : [];
    if (!posts.length) { container.innerHTML = '<div class="empty-state">尚無貼文數據，請先同步</div>'; return; }
    container.innerHTML = `<table><thead><tr>
      <th>內容</th><th>類型</th><th>發文日期</th><th>觸及</th><th>互動率</th><th>儲存</th>
    </tr></thead><tbody>
    ${posts.map(p => {
      const eng = p.reach > 0 ? (((p.like_count||0)+(p.comments_count||0))/p.reach*100).toFixed(1) : '0.0';
      return `<tr onclick="window.open('${p.permalink||'#'}','_blank')" style="cursor:pointer">
        <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.caption||'（無文案）'}</td>
        <td><span class="type-badge type-${p.media_type}">${fmtType(p.media_type)}</span></td>
        <td style="color:var(--muted)">${(p.timestamp||'').slice(5,10)}</td>
        <td>${fmt(p.reach)}</td>
        <td style="color:${eng>=5?'var(--green)':eng>=3?'var(--yellow)':'var(--red)'};font-weight:600">${eng}%</td>
        <td style="color:var(--muted)">${fmt(p.saved)}</td>
      </tr>`;}).join('')}
    </tbody></table>`;
  } catch(e) { container.innerHTML = '<div class="empty-state">載入失敗</div>'; }
}

async function loadAudience() {
  const container = document.getElementById('audience-content');
  try {
    const res = await fetch(`${API}/api/audience`);
    if (!res.ok) { container.innerHTML = '<div class="empty-state" style="grid-column:1/-1">受眾數據需要至少 100 位粉絲且完成同步</div>'; return; }
    const aud = await res.json();
    if (!aud || aud.error) { container.innerHTML = '<div class="empty-state" style="grid-column:1/-1">尚無受眾數據</div>'; return; }
    container.innerHTML = '<div class="aud-card" style="grid-column:1/-1"><h3>受眾數據</h3><pre style="color:var(--muted);font-size:12px;overflow:auto">' + JSON.stringify(aud, null, 2) + '</pre></div>';
  } catch(e) { container.innerHTML = '<div class="empty-state" style="grid-column:1/-1">載入失敗</div>'; }
}

async function triggerSync() {
  const btn = document.getElementById('sync-btn');
  btn.textContent = '↻ 同步中…'; btn.disabled = true;
  showToast('正在從 Instagram 拉取最新數據...');
  try {
    const res = await fetch(`${API}/api/sync`, {method:'POST'});
    const json = await res.json();
    if (!res.ok) throw new Error(json.detail || '同步失敗');
    showToast('✅ 同步完成！健康度已重新計算');
    await Promise.all([loadAccount(), loadHealthScore(), loadRecsPreview()]);
    if (document.getElementById('tab-analytics').classList.contains('active')) loadPosts();
    if (document.getElementById('tab-audience').classList.contains('active')) loadAudience();
    if (document.getElementById('tab-recommendations').classList.contains('active')) loadRecsFull();
  } catch(e) { showToast('❌ 同步失敗：' + e.message); }
  finally { btn.textContent = '↻ 同步'; btn.disabled = false; }
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-view').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tabId).classList.add('active');
  if (btn) btn.classList.add('active');
  if (tabId === 'analytics') loadPosts();
  if (tabId === 'recommendations') loadRecsFull();
  if (tabId === 'audience') loadAudience();
}

function switchTabMobile(tabId, el) {
  const map = {dashboard:0,analytics:1,recommendations:2,audience:3};
  document.querySelectorAll('.mob-item').forEach(i=>i.classList.remove('active'));
  el.classList.add('active');
  const navBtns = document.querySelectorAll('.nav-tab');
  navBtns.forEach(b=>b.classList.remove('active'));
  if (navBtns[map[tabId]]) navBtns[map[tabId]].classList.add('active');
  switchTab(tabId, null);
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.innerHTML = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 4000);
}
function fmt(n) { return n != null ? Number(n).toLocaleString() : '—'; }
function fmtType(t) { return {IMAGE:'圖片',VIDEO:'Reels',CAROUSEL_ALBUM:'輪播'}[t] || t; }
function formatTime(iso) {
  const d = new Date(iso), now = new Date();
  const diffH = Math.round((now - d) / 3600000);
  if (diffH < 1) return '剛才';
  if (diffH < 24) return diffH + ' 小時前';
  return Math.floor(diffH/24) + ' 天前';
}

init();
</script>
</body>
</html>
